[theme]
base = "light"
primaryColor = "#0A0A0A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F3F0"
textColor = "#0A0A0A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
maxUploadSize = 50
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
